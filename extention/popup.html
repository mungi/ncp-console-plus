<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #222;
      --sub: #595959;
      --line: #e3e5e8;
      --on: #00873C;
      --off: #9e9e9e;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title { font-size: 15px; font-weight: bold; }
    .version { font-size: 12px; color: var(--sub); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-top: 1px solid var(--line);
      background: none;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row:first-child { border-top: none; }
    .row:hover { background: #f3f5f7; }
    .row:focus-visible { outline: 2px solid var(--on); outline-offset: -2px; }
    .label { display: block; font-size: 14px; font-weight: bold; white-space: nowrap; }
    .desc { display: block; margin-top: 3px; font-size: 12px; color: var(--sub); line-height: 1.4; white-space: nowrap; }
    .switch {
      position: relative;
      flex: none;
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--off);
      transition: background-color 0.15s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s;
    }
    .row[aria-checked="true"] .switch { background: var(--on); }
    .row[aria-checked="true"] .switch::after { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <span class="title" id="ext-name">NCP Console Plus</span>
    <span class="version" id="ext-version"></span>
  </div>

  <div class="card">
    <button class="row" type="button" role="switch" aria-checked="true" data-key="tabRenameEnabled">
      <span>
        <span class="label">탭 이름을 서비스명으로 변경</span>
        <span class="desc">• 리전 아이콘, 메뉴명, 서비스명을 탭에 표시</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="row" type="button" role="switch" aria-checked="true" data-key="consoleFullscreenEnabled">
      <span>
        <span class="label">서버 접속 콘솔 추가 기능</span>
        <span class="desc">• 전체화면 전환 버튼 표시<br>• 접속 콘솔 자동 연장(최대 20분)</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </button>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
